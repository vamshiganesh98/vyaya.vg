<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(232,197,71,0.22)"/>
      <stop offset="100%" stop-color="rgba(232,197,71,0)"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Glow blob -->
  <ellipse cx="256" cy="220" rx="200" ry="160" fill="url(#glow)"/>
  <!-- Subtle border -->
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(232,197,71,0.15)" stroke-width="2"/>

  <!-- ₹ symbol — large, centered -->
  <text x="256" y="300"
    font-family="'Arial', sans-serif"
    font-size="240"
    font-weight="900"
    text-anchor="middle"
    fill="url(#gold)"
    opacity="0.95">₹</text>

  <!-- .vg signature — bottom right, small -->
  <text x="380" y="448"
    font-family="'Arial', sans-serif"
    font-size="62"
    font-weight="700"
    text-anchor="middle"
    fill="rgba(232,197,71,0.55)"
    letter-spacing="-1">.vg</text>

  <!-- Top accent dots -->
  <circle cx="152" cy="88" r="5" fill="rgba(232,197,71,0.3)"/>
  <circle cx="172" cy="88" r="3" fill="rgba(232,197,71,0.18)"/>
</svg>
